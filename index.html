<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>DUAN GRAPHICS WORKFLOW</title>

<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<!-- Favicon -->
<link rel="icon" type="image/png" href="favicon.png">

<!-- External libs (Excel + PDF) -->
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
/* Base */
body { font-family: 'Poppins', sans-serif; background:#f4faff; margin:0; padding:0; overflow-x:hidden; }

/* Loader */
#loader {
  position:fixed; inset:0; display:flex; flex-direction:column; justify-content:center; align-items:center;
  background:#fff; z-index:9999;
}
#loader img{ width:140px; height:auto; animation: blinkZoom 1.2s infinite alternate; }
#loader p{ margin-top:12px; font-weight:600; color:#005eff; text-align:center; max-width:80%; }
@keyframes blinkZoom{ 0%{transform:scale(1);opacity:1} 50%{transform:scale(1.18);opacity:0.6} 100%{transform:scale(1);opacity:1} }

/* Header */
.header {
  background: linear-gradient(135deg,#00c2ff,#005eff);
  color:#fff; padding:20px 24px; display:flex; align-items:center; gap:12px;
  position:sticky; top:0; z-index:900; box-shadow:0 4px 8px rgba(0,0,0,0.08);
}
.logo-container {
  background:#fff; padding:8px 18px; border-radius:100px; display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 6px rgba(0,0,0,0.08);
}
.logo-container img{ height:52px; display:block; }
.header-title{ font-size:20px; font-weight:600; width:100%; text-align:center; color:white; }

/* Container and controls */
.container { max-width:1200px; margin:18px auto; padding:0 16px 40px; }
.controls { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:12px; }
.controls select, .controls button { padding:8px 12px; border-radius:8px; border:1px solid #00bcd4; background:#fff; cursor:pointer; font-weight:600; }
.controls button.primary { background:#006fe6; color:#fff; border-color:transparent; }
.controls button.ghost { background:#fff; color:#333; }

/* Search */
#searchBox { width:100%; padding:12px; border-radius:8px; border:2px solid #00bcd4; box-shadow:0 0 5px rgba(0,188,212,0.2); margin-bottom:12px; }

/* Table */
.table-wrap{ overflow-x:auto; background:transparent; border-radius:10px; }
table { width:100%; border-collapse:collapse; background:#fff; box-shadow:0 6px 18px rgba(0,0,0,0.04); border-radius:10px; overflow:hidden; }
thead th {
  padding:12px; background:#006fe6; color:#fff; font-weight:700; text-transform:uppercase;
  position:sticky; top:0; z-index:5; font-size:13px; text-align:center;
}
tbody td { padding:10px 12px; border-bottom:1px solid #f0f4f8; font-size:14px; text-align:center; vertical-align:middle; }

/* Status colors */
td.status-notstarted { background:#00c2ff; color:#000; font-weight:700; border-radius:6px; }
td.status-inprogress { background:#ff9800; color:#fff; font-weight:700; border-radius:6px; }
td.status-overdue { background:#dc3545; color:#fff; font-weight:700; border-radius:6px; }
td.status-completed { background:#28a745; color:#fff; font-weight:700; border-radius:6px; }

/* Pagination */
#pagination{ text-align:center; margin-top:14px; }
#pagination button{ margin:4px; padding:8px 12px; border-radius:8px; border:none; cursor:pointer; background:#ff4d4d; color:#fff; font-weight:700; }
#pagination button.active{ background:#00bcd4; }

/* Back to top */
#backTop{ position:fixed; right:18px; bottom:18px; border:none; background:#005eff; color:#fff; padding:12px 14px; border-radius:50%; font-size:16px; display:none; box-shadow:0 6px 16px rgba(0,0,0,0.12); cursor:pointer; }

/* Responsive tweaks */
@media (max-width:900px){
  .controls{ gap:8px; }
  thead th { font-size:12px; }
  tbody td { font-size:13px; padding:9px; }
}
</style>
</head>
<body>

<!-- Loader -->
<div id="loader">
  <img src="duan.png" alt="DUAN logo">
  <p>Duan Labels Graphics — Engineering Creativity That Makes Brands Unforgettable.</p>
</div>

<!-- Header -->
<header class="header">
  <div class="logo-container"><img src="duan.png" alt="DUAN logo"></div>
  <div class="header-title">📊 GRAPHICS DESIGN WORKFLOW</div>
</header>

<!-- Main -->
<main class="container">
  <div class="controls" style="justify-content:space-between; width:100%; gap:10px;">
    <div style="display:flex; gap:10px; align-items:center;">
      <select id="filterStaff"><option value="">All Staff</option></select>
      <select id="filterStatus"><option value="">All Status</option></select>
      <select id="filterProgress"><option value="">All Progress</option></select>
      <select id="filterReceivedBy"><option value="">All Received By</option></select>
    </div>

    <div style="display:flex; gap:8px;">
      <button id="exportExcel" class="ghost">Export Excel</button>
      <button id="exportPDF" class="primary">Export PDF</button>
    </div>
  </div>

  <input id="searchBox" type="search" placeholder="Search anything…" />

  <div class="table-wrap" id="sheet-table" aria-live="polite"></div>

  <div id="pagination"></div>

  <div id="error-msg" role="alert" style="margin-top:12px;"></div>
</main>

<button id="backTop" title="Back to top">⬆️</button>

<script>
/*
  Expected Google Sheet column order (zero-based indices):
  0: Order No
  1: Task
  2: Responsible Staff
  3: Progress (text like "Not Started", "Designing", "Plates", etc.)
  4: Status (e.g. "Not Started", "In Progress", "Overdue", "Completed")
  5: Date (optional)
  6: Received By  <-- new column (7th column)
*/

const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vShpMBkjpHrb2-hEkXO2YoxJL4XYG5r4gZMrSi62E9451Ckt7KfeKTFQdyVx8iYsO5NOiyD8wJVOi9t/pub?gid=168886390&single=true&output=csv";

let currentPage = 1;
const rowsPerPage = 10;
let originalData = [[]];
let filteredData = [[]];

function hideLoader(){ const L = document.getElementById('loader'); if(L) L.style.display='none'; }
function showError(msg){ const e = document.getElementById('error-msg'); e.textContent = msg || ""; }

async function loadSheet(){
  try{
    const res = await fetch(CSV_URL);
    if(!res.ok) throw new Error("Failed to fetch sheet (status " + res.status + ")");
    const csv = await res.text();
    // Basic CSV parse (splitting rows then cells). This assumes no embedded newlines or commas inside quoted cells.
    const rows = csv.trim().split("\n").map(r => r.split(",").map(c => c.trim()));
    if(rows.length === 0) throw new Error("No rows in sheet");
    originalData = rows;
    // Initialize filteredData as full dataset
    filteredData = originalData;
    renderTable(filteredData);
    populateFilters(originalData);
    showError("");
    hideLoader();
  } catch(err){
    console.error(err);
    showError("Error loading Google Sheet data. Check sheet publish settings and CSV link.");
    document.getElementById('sheet-table').innerHTML = "<p style='text-align:center;color:#666;padding:18px;'>No data to display</p>";
    hideLoader();
  }
}

function safeCell(row, idx){ return (row && row[idx] !== undefined) ? row[idx] : ""; }

function renderTable(data){
  // data includes header row at index 0
  const header = data[0] || [];
  const rows = data.slice(1); // actual data rows
  const start = (currentPage - 1) * rowsPerPage;
  const pageRows = rows.slice(start, start + rowsPerPage);

  let html = `<table role="table" aria-label="Graphics workflow table"><thead><tr>
    <th>Order No</th>
    <th>Task</th>
    <th>Responsible Staff</th>
    <th>Progress</th>
    <th>Status</th>
    <th>Date</th>
    <th>Received By</th>
  </tr></thead><tbody>`;

  pageRows.forEach((r) => {
    // ensure we have at least 7 columns when rendering
    const order = safeCell(r,0);
    const task = safeCell(r,1);
    const staff = safeCell(r,2);
    const progressText = safeCell(r,3);
    const statusTextRaw = safeCell(r,4);
    const dateText = safeCell(r,5);
    const receivedBy = safeCell(r,6);

    // determine status class robustly
    const s = (statusTextRaw || "").toString().trim().toLowerCase();
    let statusClass = "";
    if(s.includes("not started") || s.includes("notstarted") || s.includes("pending")) statusClass = "status-notstarted";
    else if(s.includes("in progress") || s.includes("inprogress") || s.includes("designing")) statusClass = "status-inprogress";
    else if(s.includes("overdue") || s.includes("late")) statusClass = "status-overdue";
    else if(s.includes("completed") || s.includes("complete") || s.includes("done")) statusClass = "status-completed";

    html += `<tr>
      <td>${escapeHtml(order)}</td>
      <td style="text-align:left; max-width:300px; white-space:pre-wrap;">${escapeHtml(task)}</td>
      <td>${escapeHtml(staff)}</td>
      <td>${escapeHtml(progressText)}</td>
      <td class="${statusClass}">${escapeHtml(statusTextRaw)}</td>
      <td>${escapeHtml(dateText)}</td>
      <td>${escapeHtml(receivedBy)}</td>
    </tr>`;
  });

  html += "</tbody></table>";
  document.getElementById("sheet-table").innerHTML = html;
  renderPagination(rows.length);
}

// simple HTML escaper
function escapeHtml(str){
  if(str === null || str === undefined) return "";
  return String(str)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'", "&#039;");
}

function renderPagination(totalRows){
  const totalPages = Math.max(1, Math.ceil(totalRows / rowsPerPage));
  let out = "";
  for(let i=1;i<=totalPages;i++){
    out += `<button ${i===currentPage? 'class="active"':''} onclick="goToPage(${i})">${i}</button>`;
  }
  document.getElementById("pagination").innerHTML = out;
}
function goToPage(p){ currentPage = p; renderTable(filteredData); }

// Filters population
function populateFilters(data){
  // data[0] = header; data slice(1) = rows
  const rows = data.slice(1);
  const staffSet = new Set(), statusSet = new Set(), progressSet = new Set(), receivedSet = new Set();
  rows.forEach(r=>{
    staffSet.add(safeCell(r,2));
    statusSet.add(safeCell(r,4));
    progressSet.add(safeCell(r,3));
    receivedSet.add(safeCell(r,6));
  });

  const sf = document.getElementById('filterStaff');
  const st = document.getElementById('filterStatus');
  const pr = document.getElementById('filterProgress');
  const rb = document.getElementById('filterReceivedBy');

  // Clear current options except default
  [sf, st, pr, rb].forEach(sel=>{
    // keep the first default option
    sel.innerHTML = sel.options.length ? sel.options[0].outerHTML : '<option value="">All</option>';
  });

  Array.from(staffSet).filter(x=>x!=="").sort().forEach(s=> sf.innerHTML += `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`);
  Array.from(statusSet).filter(x=>x!=="").sort().forEach(s=> st.innerHTML += `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`);
  Array.from(progressSet).filter(x=>x!=="").sort().forEach(s=> pr.innerHTML += `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`);
  Array.from(receivedSet).filter(x=>x!=="").sort().forEach(s=> rb.innerHTML += `<option value="${escapeAttr(s)}">${escapeHtml(s)}</option>`);
}

// small helper to escape attribute values
function escapeAttr(s){ return String(s).replace(/"/g,'&quot;').replace(/'/g,"&#039;"); }

// Filtering function
function filterTable(){
  const staff = (document.getElementById('filterStaff').value || "").toLowerCase();
  const status = (document.getElementById('filterStatus').value || "").toLowerCase();
  const progress = (document.getElementById('filterProgress').value || "").toLowerCase();
  const received = (document.getElementById('filterReceivedBy').value || "").toLowerCase();
  const q = (document.getElementById('searchBox').value || "").toLowerCase();

  // filter over originalData (which includes header)
  const header = originalData[0] || [];
  const rows = originalData.slice(1);
  const filtered = rows.filter(r=>{
    const staffCell = (safeCell(r,2) || "").toLowerCase();
    const statusCell = (safeCell(r,4) || "").toLowerCase();
    const progressCell = (safeCell(r,3) || "").toLowerCase();
    const receivedCell = (safeCell(r,6) || "").toLowerCase();
    const rowStr = r.join(" ").toLowerCase();
    return (staff === "" || staffCell.includes(staff))
        && (status === "" || statusCell.includes(status))
        && (progress === "" || progressCell.includes(progress))
        && (received === "" || receivedCell.includes(received))
        && (q === "" || rowStr.includes(q));
  });

  // reattach header for rendering functions
  filteredData = [header, ...filtered];
  currentPage = 1;
  renderTable(filteredData);
}

document.getElementById('filterStaff').addEventListener('change', filterTable);
document.getElementById('filterStatus').addEventListener('change', filterTable);
document.getElementById('filterProgress').addEventListener('change', filterTable);
document.getElementById('filterReceivedBy').addEventListener('change', filterTable);
document.getElementById('searchBox').addEventListener('input', filterTable);

// Export to Excel (uses table in DOM to create sheet)
document.getElementById('exportExcel').addEventListener('click', ()=>{
  const table = document.querySelector('#sheet-table table');
  if(!table){ alert("No table to export"); return; }
  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.table_to_sheet(table);
  XLSX.utils.book_append_sheet(wb, ws, "DuanGraphics");
  XLSX.writeFile(wb, "DuanGraphics.xlsx");
});

// Export to PDF (landscape)
document.getElementById('exportPDF').addEventListener('click', async ()=>{
  const table = document.querySelector('#sheet-table table');
  if(!table){ alert("No table to export"); return; }
  // enlarge scale for clarity
  const canvas = await html2canvas(table, { scale: 2, useCORS:true });
  const imgData = canvas.toDataURL('image/png');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape', unit:'px', format:'a4' });
  const pdfWidth = doc.internal.pageSize.getWidth();
  const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
  doc.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
  doc.save('DuanGraphics_Workflow.pdf');
});

// Back to top behavior
const backBtn = document.getElementById('backTop');
window.addEventListener('scroll', ()=> { backBtn.style.display = window.scrollY > 220 ? 'block' : 'none'; });
backBtn.addEventListener('click', ()=> window.scrollTo({top:0, behavior:'smooth'}));

// Utility: keep table stable when changing pages
function goToPageAndRender(p){
  currentPage = p;
  renderTable(filteredData);
}
window.goToPage = function(p){ goToPageAndRender(p); };

// initial load + silent refresh every second
loadSheet();
setInterval(loadSheet, 1000);
</script>
</body>
</html>
